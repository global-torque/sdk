name: Build release artifact

on:
  push:
    tags:
      - 'v*'

permissions:
  attestations: write
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: corepack enable
      - run: corepack prepare pnpm@10.33.0 --activate
      - run: pnpm install --frozen-lockfile
      - name: Verify tag matches package version
        shell: bash
        run: |
          package_version=$(node -p "require('./package.json').version")
          test "v${package_version}" = "${GITHUB_REF_NAME}"
      - run: pnpm run format:check
      - run: pnpm run lint
      - run: pnpm run docs:check
      - run: pnpm run typecheck
      - run: pnpm run test:coverage
      - run: pnpm run test:build-atomic
      - run: pnpm run build
      - run: pnpm exec api-extractor run --verbose
      - run: pnpm run release:artifact -- --skip-build --output-dir release
      - run: node scripts/verify-package.mjs --archive release/*.tgz
      - run: node scripts/verify-packed.mjs --archive release/*.tgz
      - run: pnpm run release:verify -- --directory release --tag "${GITHUB_REF_NAME}"
      - name: Attest npm tarball
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: release/*.tgz
      - name: Create immutable prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}" release/*
          --prerelease
          --verify-tag
          --title "@global-torque/sdk ${GITHUB_REF_NAME#v}"
          --generate-notes
