name: Build release artifact

on:
  push:
    tags:
      - 'v*'

permissions:
  attestations: write
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: corepack enable
      - run: corepack prepare pnpm@10.34.5 --activate
      - run: pnpm install --frozen-lockfile
      - name: Verify tag matches package version
        shell: bash
        run: |
          package_version=$(node -p "require('./package.json').version")
          test "v${package_version}" = "${GITHUB_REF_NAME}"
      - run: pnpm run format:check
      - run: pnpm run lint
      - run: pnpm run docs:check
      - run: pnpm run typecheck
      - run: pnpm run test:coverage
      - run: pnpm run test:build-atomic
      - run: pnpm run build
      - run: pnpm exec api-extractor run --verbose
      - run: pnpm run release:artifact -- --skip-build --output-dir release
      - run: node scripts/verify-package.mjs --archive release/*.tgz
      - run: node scripts/verify-packed.mjs --archive release/*.tgz
      - run: pnpm run release:verify -- --directory release --tag "${GITHUB_REF_NAME}"
      - name: Attest npm tarball
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: release/*.tgz
      - name: Identify exact npm provenance subject
        id: npm_subject
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import { createHash } from 'node:crypto';
          import fs from 'node:fs';
          const manifest = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const archives = fs.readdirSync('release').filter(name => name.endsWith('.tgz'));
          if (archives.length !== 1) throw new Error('Expected exactly one verified npm tarball.');
          const digest = createHash('sha512').update(fs.readFileSync(`release/${archives[0]}`)).digest('hex');
          const name = manifest.name.split('/').map(encodeURIComponent).join('/');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,
            `name=pkg:npm/${name}@${manifest.version}\ndigest=sha512:${digest}\n`);
          JS
      - name: Attest npm package identity and SHA-512
        id: npm_provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ steps.npm_subject.outputs.name }}
          subject-digest: ${{ steps.npm_subject.outputs.digest }}
      - name: Preserve npm provenance outside the strict release bundle
        env:
          NPM_PROVENANCE_BUNDLE: ${{ steps.npm_provenance.outputs.bundle-path }}
        run: cp "${NPM_PROVENANCE_BUNDLE}" npm-provenance.json
      - name: Create immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          release_args=()
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            release_args+=(--prerelease)
          fi
          gh release create "${GITHUB_REF_NAME}" release/* npm-provenance.json "${release_args[@]}" \
          --verify-tag \
          --title "@global-torque/sdk ${GITHUB_REF_NAME#v}" \
          --generate-notes
