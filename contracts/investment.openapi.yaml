            - issuer_authorized_offchain_register_transfer_instruction
            - third_party_custodial_entitlement
            - third_party_linked_security
            - third_party_synthetic_security_based_swap
            - platform_entitlement_or_receipt
            - unknown
        fund_structure:
          type: string
          enum:
            - open_ended
            - closed_ended
        amount_raised:
          type: string
