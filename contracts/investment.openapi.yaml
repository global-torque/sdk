      example:
        created_at: '2026-02-10T14:30:00Z'
        account_type: checking
        account_holder_name: Jane Investor
        funding_source_id: 101
        transaction_id: txn_01HT9Y8N5T9A7Q6Z4K3W2V1M0N
    EvmAddress:
      type: string
      pattern: ^0x[0-9a-f]{40}$
      example: '0x1111111111111111111111111111111111111111'
    RawUint256:
      type: string
      pattern: ^[0-9]+$
      description: Lossless base-10 uint256 JSON string.
      example: '1000000000000000000'
    VaultLifecycle:
      type: object
      additionalProperties: false
      required:
        - deployment
        - deposit
        - position
        - redemptions
      properties:
        deployment:
          $ref: '#/components/schemas/VaultDeployment'
        deposit:
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/VaultDeposit'
        position:
          $ref: '#/components/schemas/VaultPositionBalance'
        redemptions:
          type: array
          items:
            $ref: '#/components/schemas/VaultRedemptionLifecycle'
    VaultDeployment:
      type: object
      additionalProperties: false
      required:
        - contract_id
        - status
        - chain
        - address
        - asset
        - share
      properties:
        contract_id:
          type: integer
          minimum: 1
        status:
          type: string
        chain:
          type: string
          example: ethereum-sepolia
        address:
          $ref: '#/components/schemas/EvmAddress'
        asset:
          $ref: '#/components/schemas/VaultToken'
        share:
          $ref: '#/components/schemas/VaultToken'
    VaultToken:
      type: object
      additionalProperties: false
      required:
        - symbol
        - address
        - decimals
      properties:
        symbol:
          type: string
        address:
          $ref: '#/components/schemas/EvmAddress'
        decimals:
          type: integer
          minimum: 0
    VaultDeposit:
      type: object
      additionalProperties: false
      required:
        - investment_id
        - protocol_state
        - request_origin
        - request_controller
        - custody
        - pending_assets_raw
        - claimable_assets_raw
        - claimable_shares_raw
        - claimed_assets_raw
        - claimed_shares_raw
        - controller_aggregate
        - operations
      properties:
        investment_id:
          type: integer
          format: int64
        protocol_state:
          type: string
          enum:
            - unconfirmed
            - pending
            - claimable
            - claimed
