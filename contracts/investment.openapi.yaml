openapi: 3.0.3
info:
  title: Investments
  version: 1.0.1
paths:
  /v1.0/auth/invest/{offer_slug}/{profile_id}:
    post:
      responses:
        '201':
          description: Investment initialized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvestmentDetail'
              example:
                id: 123
                offer:
                  id: 77
                  name: Oncolyze Series A
                  legal_name: Oncolyze, Inc.
                  slug: oncolyze
                  title: Oncolyze Series A Preferred Shares
                  security_type: preferred-equity
                  price_per_share: '25'
                  min_investment: '6.25'
                  image_link_id: 501
                  total_shares: '100000'
                  valuation: '25000000'
                  subscribed_shares: '14000'
                  confirmed_shares: '12000'
                  status: published
                  approved_at: '2026-01-15T12:00:00Z'
                  website: https://example.com/oncolyze
                  state: DE
                  city: Wilmington
                  reg_type: reg D 506(c)
                  close_at: '2026-12-31T23:59:59Z'
                  seo_title: Invest in Oncolyze
                  seo_description: Preferred equity offering for accredited investors.
                  data:
                    wire_to: Oncolyze Escrow Account
                    swift_id: EXAMPLEUS33
                    custodian: North Capital
                    account_number: '****1234'
                    routing_number: '****0210'
                  ticker: ONCL
                  tokenization_engine: ERC-3643
                  tokenization_model: issuer_sponsored_onchain_register
                  fund_structure: closed_ended
                  amount_raised: '350000'
                  target_raise: '2500000'
                profile_id: 42
                user_id: 7
                price_per_share: '25'
                number_of_shares: '0.25'
                amount: '6.25'
                step: review
                status: confirmed
                created_at: '2026-02-10T14:20:00Z'
                submited_at: '2026-02-10T14:45:00Z'
                funding_type: ach
                funding_status: initialize
                signature_data:
                  signature_id: sig_01HT9Y8N5T9A7Q6Z4K3W2V1M0N
                  provider: hellosign
                escrow_data:
                  provider: north_capital
                  escrow_id: esc_123
                payment_data:
                  created_at: '2026-02-10T14:30:00Z'
                  account_type: checking
                  account_holder_name: Jane Investor
                  funding_source_id: 101
                  transaction_id: txn_01HT9Y8N5T9A7Q6Z4K3W2V1M0N
                payment_type: north_capital
                escrow_type: north_capital
                entity_id: entity_123
                transaction_ref: wire_20260210_123
        '400':
          description: Request body or path parameters are invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                number_of_shares:
                  - only 50 shares left
        '401':
          description: Authorization header is missing or invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                __error__:
                  - unauthorized
        '404':
          description: Requested investment, profile, or offer was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                __error__:
                  - No object found
      parameters:
        - in: path
          name: offer_slug
          required: true
          schema:
            type: string
            example: oncolyze
          description: Public offer slug.
        - in: path
          name: profile_id
          required: true
          schema:
            type: integer
            format: int64
            example: 42
          description: Investor profile ID.
      tags:
        - Investment Creation
      security:
        - CookieAuth: []
      summary: Initialize
      operationId: InvestmentCreate
      description: |-
        Create an investor's initial commitment to an offering.
        Workflow overview:
        1. Validate investor eligibility (KYC/AML).
        2. Verify offering availability and minimum investment amount.
        3. Record the commitment, status, and allocation.
        4. Return the created investment record with its unique identifier.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvestmentDetail'
            example: {}
  /v1.0/auth/invest/{offer_slug}/amount/{id}/{profile_id}:
    put:
      responses:
        '200':
          description: Investment amount and funding source were saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AmountStep'
              example:
                amount: '6.25'
                profile_id: 42
                funding_type: ach
                funding_source_id: 101
        '400':
          description: Request body or path parameters are invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                amount:
                  - Must be an exact decimal string.
        '401':
          description: Authorization header is missing or invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                __error__:
