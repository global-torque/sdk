          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PositionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
  /v1.0/auth/redemptions:
    post:
      tags:
        - ERC-7540
      security:
        - CookieAuth: []
      operationId: RedemptionCreate
      summary: Create a share-denominated redemption intent
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 255
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RedemptionCreate'
      responses:
        '200':
          description: Idempotent replay of the existing intent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RedemptionCommandResponse'
        '201':
          description: Redemption intent created with its persisted NAV estimate.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RedemptionCommandResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
    get:
