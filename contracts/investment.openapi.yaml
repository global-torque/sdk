        valuation:
          type: string
        subscribed_shares:
          type: string
          nullable: true
          description: Legacy closed-ended projection; unused by the ERC-7540 flow.
        confirmed_shares:
          type: string
          nullable: true
          description: Legacy closed-ended projection; unused by the ERC-7540 flow.
        status:
          type: string
