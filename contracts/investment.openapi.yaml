        - in: query
          name: profile_id
          schema:
            type: integer
            minimum: 1
        - in: query
          name: include_completed
          schema:
            type: boolean
            default: true
      responses:
        '200':
          description: Authoritative redemption business and protocol projections.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RedemptionListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1.0/auth/redemptions/{redemption_id}:
    parameters:
      - in: path
        name: redemption_id
        required: true
        schema:
          type: integer
          minimum: 1
    get:
      tags:
        - ERC-7540
      security:
        - CookieAuth: []
      operationId: RedemptionGet
      summary: Get one authenticated investor redemption lifecycle
      responses:
        '200':
          description: Authoritative redemption lifecycle.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RedemptionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
        - ERC-7540
      security:
        - CookieAuth: []
      operationId: RedemptionCancel
      summary: Cancel one unlocked authenticated investor redemption
      responses:
        '200':
          description: Unlocked redemption cancelled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RedemptionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
