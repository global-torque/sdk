swagger: '2.0'
info:
  title: Crypto Wallet API.
  version: 1.0.0
basePath: /v1
paths:
  /v1.0/auth/wallet/{profile_id}:
    get:
      description: >-
        Return wallet information only, without transaction history.

        Use `chain=all` for an aggregate view across supported chains,

        or pass a single chain (`ethereum`, `ethereum-sepolia`, `polygon`, `base`) to scope the
        response.
      operationId: getWalletInfo
      parameters:
        - description: Profile ID that owns the wallet.
          format: int64
          in: path
          name: profile_id
          required: true
          type: integer
        - description: Chain selector. Use `all` for aggregate wallet view.
          enum:
            - all
            - ethereum
            - ethereum-sepolia
            - polygon
            - base
          example: all
          in: query
          name: chain
          required: true
          type: string
      responses:
        '200':
          description: Wallet information
          examples:
            application/json:
              profile_id: 123
              wallet_status: verified
              chain: polygon
              wallet_address: 1.0392900530792776e+47
              chain_account_status: verified
              balances:
                - asset: USDC
                  amount: '1250.50'
              deposit_instructions:
                chain: polygon
                address: 1.0392900530792776e+47
              updated_at: '2026-12-31T23:45:00Z'
          schema:
            $ref: '#/definitions/ProfileWalletInfoResponse'
        '400':
          description: Bad request
          schema:
            $ref: '#/definitions/Error'
        '401':
          description: Missing or invalid auth identity
          schema:
            $ref: '#/definitions/Error'
        '403':
          description: Profile does not belong to the caller
          schema:
            $ref: '#/definitions/Error'
        '404':
          description: Profile wallet not found
          schema:
            $ref: '#/definitions/Error'
        '422':
          description: Unsupported chain
          schema:
            $ref: '#/definitions/Error'
      tags:
        - AuthCryptoWallet
  /v1.0/auth/wallet/{profile_id}/transactions:
    get:
      description: >-
        Return paginated wallet transaction history separately from wallet information.

        Use `status=pending|confirmed|all` to filter transaction buckets and `cursor` for
        pagination.

        For a specific chain, the backend verifies only that chain account and returns only
        operations on that chain.

        Use `chain=all` to query profile operations once across chains.
      operationId: getWalletTransactions
      parameters:
        - description: Profile ID that owns the wallet.
          format: int64
          in: path
          name: profile_id
          required: true
          type: integer
        - description: >-
            Chain selector. Use `all` for cross-chain history, or a specific chain to verify and
            query only that chain.
          enum:
            - all
            - ethereum
            - ethereum-sepolia
            - polygon
            - base
          example: all
          in: query
          name: chain
          required: true
          type: string
        - default: all
          description: Transaction status bucket.
          enum:
            - pending
            - confirmed
            - all
          example: all
          in: query
          name: status
          type: string
        - description: Optional bounded page size.
          example: 50
          format: int64
          in: query
          name: limit
          type: integer
        - description: Opaque cursor from the previous page.
          example: opaque-cursor-value
          in: query
          name: cursor
          type: string
      responses:
        '200':
          description: Wallet transaction history
          examples:
            application/json:
              profile_id: 123
              chain: all
              status: all
              items:
                - operation_id: '501'
                  operation_type: withdrawal
                  operation_status: submitted
                  chain: ethereum-sepolia
                  asset: USDC
                  amount: '100.000000000000000000'
                  counterparty_address: 6.1138228683162145e+47
                  token_address: 1.6264587680586241e+47
                  token_decimals: 6
                  price_usd: '1.00'
                  amount_usd: '100.00'
                  created_at: '2026-12-31T23:45:00Z'
                - operation_id: '502'
                  operation_type: deposit
                  operation_status: confirmed
                  chain: ethereum
                  asset: ETH
                  amount: '0.250000000000000000'
                  tx_hash: 3567
                  token_decimals: 18
                  created_at: '2026-12-31T23:40:00Z'
                  confirmed_at: '2026-12-31T23:47:00Z'
              next_cursor: opaque-cursor-value
          schema:
            $ref: '#/definitions/WalletTransactionsResponse'
        '400':
          description: Bad request
          schema:
            $ref: '#/definitions/Error'
        '401':
          description: Missing or invalid auth identity
          schema:
            $ref: '#/definitions/Error'
        '403':
          description: Profile does not belong to the caller
          schema:
            $ref: '#/definitions/Error'
        '404':
          description: Profile wallet not found
          schema:
            $ref: '#/definitions/Error'
        '422':
          description: Unsupported chain or invalid pagination parameters
          schema:
            $ref: '#/definitions/Error'
      tags:
        - AuthCryptoWallet
  /v1.0/auth/wallet/authorize/sessions/{profile_id}:
    get:
      description: |-
        List current active wallet authorization sessions for the authenticated profile wallet.
        Expired sessions are not returned.
      operationId: getWalletAuthorizationSessions
      parameters:
        - description: Profile ID that owns the wallet.
          format: int64
          in: path
          name: profile_id
          required: true
          type: integer
        - description: Optional status filter. Defaults to `active`.
          enum:
            - active
          in: query
          name: status
          type: string
        - description: Optional chain filter.
          enum:
            - ethereum
            - ethereum-sepolia
            - polygon
            - base
          in: query
          name: chain
          type: string
        - description: Optional token contract address filter.
          in: query
          name: asset_address
          type: string
        - description: Optional exchange destination asset filter.
          in: query
          name: to_asset_address
          type: string
        - description: Optional authorization option id filter.
          in: query
          name: authorization_option_id
          type: string
        - description: Optional operation type filter.
          enum:
            - withdrawal
            - exchange
            - delegation
          in: query
          name: operation_type
          type: string
        - description: Optional delegation type filter.
          enum:
            - contract_functions
            - root
          in: query
          name: delegation_type
          type: string
      responses:
        '200':
          description: Active wallet authorization sessions
          examples:
            application/json:
              profile_id: 123
              status: active
              chain: polygon
              asset_address: 3.441810188089762e+47
              items:
                - session_id: 0xSESSION_ID
                  authorization_option_id: withdrawal_transfer
                  operation_type: withdrawal
                  wallet_address: 1.0392900530792776e+47
                  chain: polygon
                  token_symbol: USDC
                  token_address: 3.441810188089762e+47
                  asset_address: 3.441810188089762e+47
                  max_amount: '1000000000'
                  remaining_amount: '999999750'
                  issued_at: '2026-12-31T23:45:00Z'
                  expires_at: '2027-01-01T00:00:00Z'
                  authorization_status: active
          schema:
            $ref: '#/definitions/WalletAuthorizationSessionsResponse'
        '400':
          description: Bad request
          schema:
            $ref: '#/definitions/Error'
        '401':
          description: Missing or invalid auth identity
          schema:
            $ref: '#/definitions/Error'
        '403':
          description: Profile does not belong to the caller
          schema:
            $ref: '#/definitions/Error'
        '404':
          description: Profile wallet not found
          schema:
            $ref: '#/definitions/Error'
      tags:
        - AuthCryptoWallet
definitions:
  ProfileWalletInfoResponse:
    description: Wallet information view without transaction history.
    properties:
      balances:
        items:
          $ref: '#/definitions/WalletBalanceResponse'
        type: array
      chain:
        example: polygon
        type: string
      chain_account_status:
        enum:
          - pending
          - verified
          - failed
          - suspended
        example: verified
        type: string
      chains:
        items:
          $ref: '#/definitions/WalletChainInfoResponse'
        type: array
      deposit_instructions:
        $ref: '#/definitions/WalletDepositInstructionResponse'
      profile_id:
        example: 123
        format: int64
        type: integer
      rwa_asset_balance:
        $ref: '#/definitions/WalletBalanceSummaryResponse'
      tradable_crypto_balance:
        $ref: '#/definitions/WalletBalanceSummaryResponse'
      updated_at:
        example: '2026-12-31T23:45:00Z'
        type: string
      wallet_address:
        example: 1.0392900530792776e+47
        type: string
      wallet_status:
        enum:
          - created
          - verified
          - suspended
          - closed
          - failed
        example: verified
        type: string
    type: object
  WalletBalanceResponse:
    description: Token balance for a single asset on a single chain account.
    properties:
      amount:
        description: Decimal string balance. Never a floating-point JSON number.
        example: '1250.500000'
        type: string
      amount_usd:
        description: Estimated USD value when pricing data is available.
        example: '1250.50'
        type: string
      balance_type:
        description: Frontend balance bucket for wallet summary cards and holdings sections.
        enum:
          - tradable_crypto
          - rwa_asset
        example: tradable_crypto
        type: string
      chain:
        enum:
          - ethereum
          - ethereum-sepolia
          - polygon
          - base
        example: ethereum-sepolia
        type: string
      is_native:
        example: false
        type: boolean
      price_usd:
        description: Estimated USD unit price when pricing data is available.
        example: '1'
        type: string
      token_address:
        description: Token contract address on the given chain. Empty for native assets.
        example: 9.175510568426712e+47
        type: string
      token_decimals:
        example: 18
        format: int32
        type: integer
      token_logo:
        description: >-
          Token logo URL. Platform offer tokens use ::filer-api::/v1.0/public/files/{offer
          image_link_id}.
        example: '::filer-api::/v1.0/public/files/42'
        type: string
      token_name:
        example: USD Coin
        type: string
      token_price:
        description: >-
          Unit token price. Platform offer tokens use offer_offers.price_per_share; other tokens use
          Alchemy USD pricing when available.
        example: '1'
        type: string
      token_standard:
        enum:
          - native
          - erc20
        example: erc20
        type: string
      token_symbol:
        description: Token symbol.
        example: USDC
        type: string
      token_value:
        description: token amount multiplied by token_price.
        example: '1250.50'
        type: string
    type: object
  WalletChainInfoResponse:
    description: Per-chain wallet summary included in the aggregate wallet information response.
    properties:
      chain:
        enum:
          - ethereum
          - ethereum-sepolia
          - polygon
          - base
        example: polygon
        type: string
      chain_account_status:
        enum:
          - pending
          - verified
          - failed
          - suspended
        example: verified
        type: string
      wallet_address:
        example: 1.0392900530792776e+47
        type: string
    type: object
  WalletDepositInstructionResponse:
    description: Deposit instruction for a single chain account.
    properties:
      address:
        example: 1.0392900530792776e+47
        type: string
      chain:
        enum:
          - ethereum
          - ethereum-sepolia
          - polygon
          - base
        example: polygon
        type: string
    type: object
  WalletBalanceSummaryResponse:
    description: USD summary for one frontend wallet balance bucket.
    properties:
      amount_usd:
        example: '1250.50'
        type: string
      token_count:
        example: 2
        format: int64
        type: integer
    type: object
  WalletTransactionsResponse:
    description: Paginated wallet transaction history returned separately from wallet information.
    properties:
      chain:
        enum:
          - all
          - ethereum
          - ethereum-sepolia
          - polygon
          - base
        example: all
        type: string
      items:
        items:
          $ref: '#/definitions/WalletTransactionHistoryItem'
        type: array
      next_cursor:
        example: opaque-cursor-value
        type: string
      profile_id:
        example: 123
        format: int64
        type: integer
      status:
        enum:
          - all
          - pending
          - confirmed
        example: all
        type: string
    type: object
  WalletTransactionHistoryItem:
    description: One item in paginated wallet transaction history.
    properties:
      amount:
        example: '100.000000000000000000'
        type: string
      amount_usd:
        description: Estimated USD value when pricing data is available.
        example: '100.00'
        type: string
      asset:
        example: USDC
        type: string
      chain:
        enum:
          - ethereum
          - ethereum-sepolia
          - polygon
          - base
        example: polygon
        type: string
      confirmed_at:
        example: '2026-12-31T23:47:00Z'
        type: string
      created_at:
        example: '2026-12-31T23:45:00Z'
        type: string
      counterparty_address:
        description: Source or destination address on the other side of the transfer.
        example: 6.1138228683162145e+47
        type: string
      operation_id:
        example: '501'
        type: string
      operation_status:
        description: Canonical wallet operation status.
        enum:
          - created
          - submitted
          - confirmed
          - failed
        example: submitted
        type: string
      operation_type:
        enum:
          - deposit
          - withdrawal
          - investment
        example: withdrawal
        type: string
      price_usd:
        description: Token unit price in USD when pricing data is available.
        example: '1.00'
        type: string
      token_address:
        description: ERC-20 contract address. Empty for native chain assets.
        example: 9.175510568426712e+47
        type: string
      token_decimals:
        example: 6
        format: int64
        type: integer
      token_logo:
        example: https://static.alchemyapi.io/images/assets/3408.png
        type: string
      token_name:
        example: USD Coin
        type: string
      tx_hash:
        description: >-
          Chain transaction hash. Omitted for submitted platform operations until the webhook or
          reconciler assigns a real transaction hash.
        example: 2748
        type: string
    type: object
  WalletAuthorizationSessionsResponse:
    description: Active wallet authorization sessions for the requested profile wallet.
    properties:
      asset_address:
        example: '0x3c499c542cef5e3811e1192ce70d8cc03d5c3359'
        type: string
      authorization_option_id:
        example: withdrawal_transfer
        type: string
      chain:
        example: polygon
        type: string
      delegation_type:
        example: contract_functions
        type: string
      items:
        items:
          $ref: '#/definitions/WalletAuthorizationSessionResponse'
        type: array
      operation_type:
        enum:
          - withdrawal
          - exchange
          - delegation
        example: withdrawal
        type: string
      profile_id:
        example: 123
        format: int64
        type: integer
      status:
        enum:
          - active
        example: active
        type: string
      to_asset_address:
        example: '0x1c7d4b196cb0c7b01d743fbc6116a902379c7238'
        type: string
      token_address:
        example: '0x3c499c542cef5e3811e1192ce70d8cc03d5c3359'
        type: string
    type: object
  WalletAuthorizationSessionResponse:
    description: Current active wallet authorization session metadata.
    properties:
      asset_address:
        example: '0x3c499c542cef5e3811e1192ce70d8cc03d5c3359'
        type: string
      authorization_option_id:
        example: withdrawal_transfer
        type: string
      authorization_status:
        enum:
          - active
        example: active
        type: string
      chain:
        example: polygon
        type: string
      delegation_params:
        additionalProperties: true
        type: object
      delegation_type:
        example: contract_functions
        type: string
      expires_at:
        example: '2027-01-01T00:00:00Z'
        type: string
      issued_at:
        example: '2026-12-31T23:45:00Z'
        type: string
      max_amount:
        example: '10000'
        type: string
      operation_type:
        enum:
          - withdrawal
          - exchange
          - delegation
        example: withdrawal
        type: string
      remaining_amount:
        example: '9900'
        type: string
      session_id:
        example: 0xSESSION_ID
        type: string
      to_asset_address:
        example: '0x1c7d4b196cb0c7b01d743fbc6116a902379c7238'
        type: string
      token_address:
        example: '0x3c499c542cef5e3811e1192ce70d8cc03d5c3359'
        type: string
      token_symbol:
        example: USDC
        type: string
      wallet_address:
        example: 1.0392900530792776e+47
        type: string
    type: object
  Error:
    properties:
      message: {}
    type: object
